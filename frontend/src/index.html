<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - SceneSeek</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles/style.css">
    <script src="/api/shared.js" defer></script>
    <script src="/api/identify.js" defer></script>
</head>
<body>
    <header>
        <h1>SceneSeek</h1>
        <h4>Мультимодальный поиск по видео</h4>
    </header>
    <main>
        <section class="card" id="identify-card">
            <h2>Идентификация</h2>
            <form id="identify-form">
                <label>
                    Никнейм
                    <input type="text" id="nickname-input" placeholder="Введите имя" required autocomplete="off">
                </label>
                <label>
                    Пароль
                    <input type="password" id="password-input" placeholder="Введите пароль" required autocomplete="current-password">
                </label>
                <button type="submit">Войти</button>
            </form>
            <div class="status-line">
                <span>Статус:</span>
                <strong id="user-status">ожидание ввода</strong>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025-2026</p>
    </footer>
</body>
</html>
